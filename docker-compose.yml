services:
  postgres:
    image: postgres:15-alpine
    container_name: brightech_pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: brightech
      POSTGRES_PASSWORD: brightech
      POSTGRES_DB: brightech_jms
    ports:
      - "5433:5432"   # host 5433 -> avoids clashing with any native PG on 5432
    volumes:
      - brightech_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brightech -d brightech_jms"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  brightech_pgdata:
